<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Editor 3D</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #2b2f33; font-family: system-ui, sans-serif; }
  #canvasWrap { position: fixed; top: 120px; left: 0; right: 200px; bottom: 0; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  #toolbar {
    position: fixed; top: 0; left: 0; right: 200px;
    display: flex; flex-direction: column; gap: 8px; padding: 8px 10px;
    background: rgba(20,22,24,0.9); z-index: 10;
  }
  .row { display: flex; gap: 8px; overflow-x: auto; }
  .tbtn, .abtn {
    font-size: 16px; padding: 12px 10px; white-space: nowrap;
    border: 2px solid #555; border-radius: 12px;
    background: #3a3f44; color: #eee;
    -webkit-tap-highlight-color: transparent;
  }
  .tbtn { flex: 1; max-width: 130px; }
  .tbtn.active { background: #ffcc33; color: #222; border-color: #ffcc33; }
  .abtn { min-width: 68px; }
  .abtn:active { background: #4a5157; }

  #layersPanel {
    position: fixed; top: 0; right: 0; bottom: 0; width: 200px;
    background: rgba(20,22,24,0.92); z-index: 10;
    display: flex; flex-direction: column;
    padding: 10px 8px; box-sizing: border-box; gap: 8px;
    overflow-y: auto;
  }
  #layersPanel h3 { color: #ccc; font-size: 13px; margin: 0 0 4px; text-transform: uppercase; letter-spacing: 0.05em; }
  #layerEmpty { color: #888; font-size: 13px; }
  .layer-row {
    display: flex; align-items: center; gap: 6px;
    background: #3a3f44; border: 2px solid transparent; border-radius: 10px;
    padding: 8px; cursor: pointer;
  }
  .layer-row.active { border-color: #ffcc33; }
  .layer-label { flex: 1; color: #eee; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .layer-btn { background: none; border: none; font-size: 17px; padding: 4px; color: #ddd; }

  #hint {
    position: fixed; bottom: 10px; left: 0; right: 200px; text-align: center;
    color: #bbb; font-size: 13px; z-index: 10; pointer-events: none;
  }
</style>
</head>
<body>
  <div id="toolbar">
    <div class="row">
      <button class="abtn" data-add="cube">🧊 Cubo</button>
      <button class="abtn" data-add="sphere">⚪ Esfera</button>
      <button class="abtn" data-add="cylinder">🥫 Cilindro</button>
      <button class="abtn" data-add="cone">🔺 Cono</button>
      <button class="abtn" data-add="plane">▭ Plano</button>
    </div>
    <div class="row">
      <button class="tbtn" data-mode="translate">↔️ Mover</button>
      <button class="tbtn" data-mode="rotate">🔄 Rotar</button>
      <button class="tbtn" data-mode="scale">↕️ Escalar</button>
    </div>
  </div>

  <div id="canvasWrap"></div>

  <div id="layersPanel">
    <h3>Objetos</h3>
    <div id="layerList"></div>
    <p id="layerEmpty">Todavía no agregaste nada. Usá los botones de arriba.</p>
  </div>

  <div id="hint">Tocá una figura o su nombre en la lista para seleccionarla · arrastrá el fondo para orbitar la cámara</div>

  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js"
    }
  }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
